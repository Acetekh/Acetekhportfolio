<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | ACETECH</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconify Icons -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body class="bg-[#0b0b0e] text-neutral-200 font-sans min-h-screen flex flex-col justify-between selection:bg-[#0adee5]/30 selection:text-[#0adee5] overflow-x-hidden">

  <!-- ================= TOP HEADER ================= -->
  <header class="w-full bg-[#0b0b0e]/80 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between">
      
    
      <!-- Back Home Action (Using Your Exact Corner-Bracket Button Style) -->
      <a href="home.html" class="relative group inline-flex items-center justify-center px-4 py-2.5 bg-white/[0.03] hover:bg-white/[0.08] backdrop-blur-md border border-white/10 transition-all duration-300">
        <span class="absolute top-0 left-0 w-2.5 h-2.5 border-t-2 border-l-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:-translate-x-0.5 group-hover:-translate-y-0.5"></span>
        <span class="absolute top-0 right-0 w-2.5 h-2.5 border-t-2 border-r-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></span>
        <span class="absolute bottom-0 left-0 w-2.5 h-2.5 border-b-2 border-l-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:-translate-x-0.5 group-hover:translate-y-0.5"></span>
        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 border-b-2 border-r-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:translate-x-0.5 group-hover:translate-y-0.5"></span>

        <span class="text-xs font-mono tracking-[0.15em] uppercase text-white font-semibold flex items-center gap-2 whitespace-nowrap">
          <iconify-icon icon="lucide:arrow-left" class="text-sm text-[#0adee5] transition-transform duration-300 group-hover:-translate-x-1"></iconify-icon>
          Back Home
        </span>
      </a>

    </div>
  </header>


  <!-- ================= MAIN COMING SOON CONTENT (Exact Project Card Split Layout) ================= -->
  <main class="flex-grow flex items-center py-16">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 w-full">
      
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Left Side: Browser Window Mockup (Identical to your project cards) -->
        <div class="lg:col-span-7">
          <div class="bg-[#121216] border border-white/10 rounded-3xl p-4 shadow-2xl">
            <div class="bg-[#0b0b0e] rounded-2xl overflow-hidden border border-white/5 aspect-[16/10] relative flex items-center justify-center group">
              <div class="absolute inset-0 opacity-60"></div>
              
              <div class="relative z-10 flex flex-col items-center gap-3 text-center px-6">
                <div class="w-12 h-12 rounded-full border border-[#0adee5]/30 bg-[#0adee5]/10 flex items-center justify-center text-[#0adee5] animate-pulse">
                  <iconify-icon icon="lucide:clock" class="text-xl"></iconify-icon>
                </div>
                <span class="font-mono text-sm text-neutral-300 tracking-widest uppercase">System in Progress</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Side: Text & Notification Form (Using Your Exact Corner-Bracket Button Style) -->
        <div class="lg:col-span-5 flex flex-col items-start gap-5">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.03] border border-white/10">
            <span class="w-1.5 h-1.5 rounded-full bg-[#0adee5] animate-ping"></span>
            <span class="text-[10px] font-mono text-neutral-300 uppercase tracking-widest">Status: In Development</span>
          </div>
          
          <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white font-mono">
            Project Case Study
          </h1>
          
          <p class="text-neutral-400 text-sm sm:text-base leading-relaxed">
            Coming soon
          </p>

          <!-- Email Notification Input Form -->
          <form onsubmit="event.preventDefault(); alert('Subscribed successfully!');" class="w-full flex flex-col sm:flex-row gap-3 pt-2">
            <input type="email" required placeholder="Enter your email address" class="flex-grow bg-white/[0.03] border border-white/15 rounded-full px-5 py-3.5 text-sm text-white placeholder-neutral-500 font-mono focus:outline-none focus:border-neutral-500 transition-all duration-300">
            
            <!-- Action Button with Your Exact Corner Brackets -->
            <button type="submit" class="relative group inline-flex items-center justify-center px-6 py-3.5 bg-white/[0.03] hover:bg-white/[0.08] backdrop-blur-md border border-white/10 transition-all duration-300 cursor-pointer whitespace-nowrap">
              <span class="absolute top-0 left-0 w-2.5 h-2.5 border-t-2 border-l-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:-translate-x-0.5 group-hover:-translate-y-0.5"></span>
              <span class="absolute top-0 right-0 w-2.5 h-2.5 border-t-2 border-r-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></span>
              <span class="absolute bottom-0 left-0 w-2.5 h-2.5 border-b-2 border-l-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:-translate-x-0.5 group-hover:translate-y-0.5"></span>
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 border-b-2 border-r-2 border-white/80 pointer-events-none transition-transform duration-300 group-hover:translate-x-0.5 group-hover:translate-y-0.5"></span>

              <span class="text-xs font-mono tracking-[0.15em] uppercase text-white font-semibold flex items-center gap-2">
                Notify Me
                <iconify-icon icon="lucide:arrow-up-right" class="text-base text-[#0adee5] transition-transform duration-300 group-hover:translate-x-1"></iconify-icon>
              </span>
            </button>
          </form>
        </div>

      </div>

    </div>
  </main>


 

</body>
</html>
