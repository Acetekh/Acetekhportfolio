<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | ACETECH</title>
    <link rel="icon" href="./image/Acetekhlogo.PNG" type="image/png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconify Icons -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>



<!-- Primary Meta Tags -->
    <meta name="title" content="ACETEKH — Frontend Developer & UI/UX Designer Portfolio">
    <meta name="description" content="Portfolio of Philip Clement, showcasing frontend development projects, UI/UX design case studies, and web applications.">

    <!-- Open Graph / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://acetekhportfolio.vercel.app/">
    <meta property="og:title" content="ACETEKH — Frontend Developer & UI/UX Designer Portfolio">
    <meta property="og:description" content="Explore my latest projects, case studies, and UI/UX design work.">
    <meta property="og:image" content="./image/Acetekhlogo.PNG">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://acetekh.vercel.app/">
    <meta property="twitter:title" content="ACETEKH — Frontend Developer & UI/UX Designer Portfolio">
    <meta property="twitter:description" content="Explore my latest projects, case studies, and UI/UX design work.">
    <meta property="twitter:image" content="./image/Acetekhlogo.PNG">
</head>

<body class="bg-[#050507] text-neutral-200 font-sans min-h-screen flex items-center justify-center px-6 relative overflow-hidden">

    <!-- Background Tech Grid -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

    <!-- Outer Tech Frame with Corner Brackets -->
    <div class="max-w-md w-full bg-[#0b0b0f] border border-white/10 p-8 sm:p-10 relative shadow-2xl z-10">
        
        <!-- Large Corner Brackets for Main Card -->
        <span class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-[#0adee5]"></span>
        <span class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-[#0adee5]"></span>
        <span class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-[#0adee5]"></span>
        <span class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-[#0adee5]"></span>

        <!-- Header Meta (Dynamic Dispatch ID) -->
        <div class="flex items-center justify-between font-mono text-[10px] text-neutral-500 uppercase tracking-widest border-b border-neutral-800 pb-4 mb-6">
            <span id="dispatch-id">SYS_DISPATCH // --</span>
            <span class="text-[#0adee5]">STATUS: CONFIRMED</span>
        </div>

        <div class="space-y-4 mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight uppercase">
                Message Received.
            </h1>
            <p class="text-xs font-mono text-neutral-400 leading-relaxed">
                [SUCCESS] Message delivered. Direct response pending. Check back soon.
            </p>
        </div>

        <!-- Dynamic Terminal Status Bar -->
        <div class="bg-black/60 border border-neutral-800 p-3 mb-8 font-mono text-[11px] text-neutral-400 space-y-1">
            <div class="flex justify-between">
                <span>PACKET_STATE:</span>
                <span class="text-emerald-400">DELIVERED</span>
            </div>
            <div class="flex justify-between">
                <span>RECIPIENT:</span>
                <span class="text-white">ACETEKH</span>
            </div>
            <div class="flex justify-between">
                <span>TIME_STAMP:</span>
                <span id="timestamp" class="text-neutral-300">--:--:--</span>
            </div>
            <div class="flex justify-between pt-1 border-t border-neutral-900">
                <span>AUTO_REDIRECT:</span>
                <span class="text-[#0adee5]">IN <span id="timer">5</span>s</span>
            </div>
        </div>

        <!-- Your exact button -->
        <a href="home.html"
            class="w-full relative group inline-flex items-center justify-center px-6 py-4 bg-white/[0.03] hover:bg-white/[0.08] backdrop-blur-md border border-white/10 transition-all duration-300">
            <span class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-white"></span>
            <span class="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-white"></span>
            <span class="absolute bottom-0 left-0 w-2 h-2 border-b-2 border-l-2 border-white"></span>
            <span class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-white"></span>

            <span class="text-white text-xs sm:text-sm font-mono font-semibold tracking-wider uppercase">Return Home</span>
            <iconify-icon icon="lucide:arrow-left"
                class="text-[#0adee5] mr-2 text-base group-hover:-translate-x-1 transition-transform duration-300 order-first"></iconify-icon>
        </a>

    </div>

    <!-- Terminal Logic Script -->
    <script>
        // 1. Generate Dynamic Dispatch ID (e.g. #7492)
        const randomID = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('dispatch-id').innerText = `SYS_DISPATCH // #${randomID}`;

        // 2. Display Current Timestamp
        const now = new Date();
        document.getElementById('timestamp').innerText = now.toLocaleTimeString('en-US', { hour12: false });

        // 3. Countdown & Auto-Redirect
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timerElement) timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = 'home.html';
            }
        }, 1000);
    </script>

</body>

</html>
