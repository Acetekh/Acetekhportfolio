<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | ACETECH</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconify Icons -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-[#0b0b0e] text-neutral-200 font-sans min-h-screen flex items-center justify-center px-6">

  <div class="max-w-md w-full bg-[#121216]/95 backdrop-blur-xl border border-white/10 p-8 sm:p-10 rounded-3xl relative shadow-2xl text-center flex flex-col items-center">
    
    <!-- Success Icon Indicator -->
    <div class="w-16 h-16 flex items-center justify-center text-white mb-6">
<i class="fa-solid fa-check text-6xl text-[#0adee5]/80"></i>
    </div>



    <!-- Status Tag -->
    <span class="text-xs font-mono text-[#0adee5] backdrop-blur-md border border-neutral-700 uppercase tracking-widest bg-white/5  px-3 py-1 rounded-full mb-3">
     Successfully sent
    </span>

    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3">
      Message Received
    </h1>

    <p class="text-neutral-400 text-sm leading-relaxed mb-8">
      Thank you for reaching out. I will get back to you shortly.
    </p>

    <!-- Return Home Button -->
    <a href="home.html" class="w-full relative group inline-flex items-center justify-center px-6 py-4 bg-white/[0.03] hover:bg-white/[0.08] backdrop-blur-md border border-white/10 transition-all duration-300">
      <span class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-white"></span>
      <span class="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-white"></span>
      <span class="absolute bottom-0 left-0 w-2 h-2 border-b-2 border-l-2 border-white"></span>
      <span class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-white"></span>

      <span class="text-white text-xs sm:text-sm font-mono font-semibold tracking-wider uppercase">Return Home</span>
      <iconify-icon icon="lucide:arrow-left" class="text-[#0adee5] mr-2 text-base group-hover:-translate-x-1 transition-transform duration-300 order-first"></iconify-icon>
    </a>

  </div>

</body>
</html>
